<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div class="game-container">
  <div class="backToHome"><a href="index.html">Back to Home &larr;</a></div>
  <h1>🕵️ Real or Fake CS Skin?</h1>

  <div class="skin-card">

    <img id="skin-image" />

    <h2 id="skin-name"></h2>

  </div>

  <div class="buttons">

    <button id="real-btn">
      ✅ REAL
    </button>

    <button id="fake-btn">
      ❌ FAKE
    </button>

  </div>

  <div class="stats">

    <p>
      Score:
      <span id="score">0</span>
    </p>

    <p>
      Best:
      <span id="best-score">0</span>
    </p>

  </div>

  <p id="result-message"></p>

  <button id="next-btn" class="hidden">
    Next Round
  </button>

</div>
</body>
</html>
