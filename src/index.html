<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSGO Skins</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>CSGO Skins</h1>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search skins..." />
    </div>

    <div class="category-bar">
      <div class="category-guns">
        <button data-category="All" class="active">All</button>
        <button data-category="Knives">Knives</button>
        <button data-category="Gloves">Gloves</button>
        <button data-category="Pistols">Pistols</button>
        <button data-category="Rifles">Rifles</button>
        <button data-category="SMGs">SMGs</button>
        <button data-category="Heavy">Heavy</button>
      </div>
      <div class="category-team">
        <button data-category="terrorists">Terrorist</button>
        <button data-category="counter-terrorists">Counter-Terrorist</button>
      </div>
    </div>

    <div id="skins-container" class="grid"></div>

    <script src="app.js"></script>
  </body>
</html>
