<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CS Case Simulator</title>

  <link rel="stylesheet" href="./css/caseSimulator.css" />
</head>
<body>
  <div class="backToHome"><a href="index.html">Back to Home &larr;</a></div>
  <div class="page">

    <h1 class="title">CS Case Simulator 🎰</h1>

    <div class="roulette-container">

      <!-- center line -->
      <div class="pointer"></div>

      <!-- wheel -->
      <div id="wheel-wrapper">
        <div id="wheel"></div>
      </div>

    </div>

    <button id="open-case">
      Open Case
    </button>

    <div id="result"></div>

  </div>

  <div id="result-container">

    <div class="result-card hidden">

      <img id="result-image" src="" alt="skin image" />

      <div class="result-info">

        <h2 id="result-name"></h2>

        <p>
          <strong>Weapon:</strong>
          <span id="result-weapon"></span>
        </p>

        <p>
          <strong>Category:</strong>
          <span id="result-category"></span>
        </p>

        <p>
          <strong>Rarity:</strong>
          <span id="result-rarity"></span>
        </p>

        <p>
          <strong>Float range:</strong>
          <span id="result-float"></span>
        </p>

        <p>
          <strong>Pattern:</strong>
          <span id="result-pattern"></span>
        </p>

      </div>
    </div>
  </div>
</body>
</html>
